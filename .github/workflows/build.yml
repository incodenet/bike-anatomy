name: Build standalone HTML

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run validate:standalone

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-app
          path: dist/index.html
          if-no-files-found: error
